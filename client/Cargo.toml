# The FH2MP chat client (Rust): the MTProto 2.0 client of our own schema (proto/fh2mp.tl); the chat core and its window come later.
[workspace]
resolver = "3"
members = ["crates/fh2mp-tl", "crates/fh2mp-mtproto"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
grammers-crypto = "0.12"
grammers-mtproto = "0.12"
grammers-tl-types = "0.12"
grammers-tl-gen = "0.12"
grammers-tl-parser = "2"

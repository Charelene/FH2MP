# nginx in front of the FH2MP LSP: TLS for the launcher's sign-in and for the game's own HTTP traffic (the shim speaks https when the server's
# config says so). Installed on the VPS as /etc/nginx/sites-available/forza-api (symlinked into sites-enabled).
# Certificate: one cert for both names, issued with the webroot authenticator the other site already uses:
#   sudo certbot certonly --webroot -w /var/www/certbot -d api.forza.scuffed.af -d dev-api.forza.scuffed.af   (renewal: certbot.timer)
# (before the first issue, comment out the two 443 servers and the 301, or use the bootstrap in docs/environments.md)
# DNS: A records only, DNS-only (not proxied by Cloudflare), NO AAAA: tokens are bound to the address that signed in, so the client IP must be what the
# LSP sees (X-Real-IP below) and must match the IPv4 UDP source.
# Operator endpoints (/admin, /api) are never forwarded: they are loopback-only in the LSP as well.

map $request_uri $fh2mp_blocked {
    default 0;
    ~^/(admin|api|ops)(/|$) 1;
}

server {
    listen 80;
    server_name api.forza.scuffed.af dev-api.forza.scuffed.af;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name api.forza.scuffed.af;
    ssl_certificate     /etc/letsencrypt/live/api.forza.scuffed.af/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.forza.scuffed.af/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    location ~ ^/v1/crash-reports/?$ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
    location / {
        if ($fh2mp_blocked) { return 404; }
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";          # the LSP trusts X-Real-IP from loopback only; never pass a client-made chain on
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name dev-api.forza.scuffed.af;
    ssl_certificate     /etc/letsencrypt/live/api.forza.scuffed.af/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.forza.scuffed.af/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 20m;
    location ~ ^/v1/crash-reports/?$ {
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
    location / {
        if ($fh2mp_blocked) { return 404; }
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

name: release

# Push a tag like v1.5.0 to build the shim and publish a GitHub release: the shim zip (fh2-mods/FH2MP.dll, signed), the launcher's files
# and the signed manifest launchers update from. Since 1.5.0 the launcher is Encore: it is not built here, its files are taken from Encore's
# own release as release/launcher.json pins them (repository, tag, file names, SHA-256 and sizes) and published again with this release,
# because a 1.4.x FH2MP Launcher downloads its update from the manifest's own tag. The Guide (FH2MPGuide.dll) is Encore's too.
# A tag whose shim/VERSION is another version (release/versions.sh) carries that shim: its signed manifest entry and zip are copied from the
# release of its version, so the new release holds every file its manifest names.
# Secrets: RELEASE_SIGNING_KEY = base64 Ed25519 seed (native/cmd/fh2mp-release keygen; its public half is release/release-key.pub, which
# the 1.4.x launchers and Encore embed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the publish job can write (create the release). Actions are pinned to reviewed commits (tag in the comment) and
# the build tools to hashes (security audit 2026-10-25 F04/F15): bump them on purpose, never to a moving tag.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      shim: ${{ steps.versions.outputs.shim }}
      launcher: ${{ steps.versions.outputs.launcher }}
      build_shim: ${{ steps.versions.outputs.build_shim }}
      kind: ${{ steps.versions.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: true }
      - name: versions agree with the tag
        id: versions
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then set -- --tag "$GITHUB_REF_NAME"; else set --; fi
          release/versions.sh "$@" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: native/go.mod, cache: false }
      # the launcher pin is complete (every file with its SHA-256 and size) before anything is built
      - run: . release/reltool.sh && reltool launcher-pin check
      # The same checks and image as ci.yml (release/ci.sh); publish.sh only tags commits whose ci.yml run passed, so this is the last word,
      # not the first.
      - uses: ./.github/actions/ci-image
      - run: release/ci.sh --container go unit

  shim:
    needs: check
    if: needs.check.outputs.build_shim == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: true }
      - uses: ./.github/actions/ci-image
      - run: release/ci.sh --container shim
        timeout-minutes: 10
      - run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"      # back to the runner's user for the build
      # the runner image usually has mingw already; the apt mirror has hung here, so install only if missing, with timeouts
      - run: command -v x86_64-w64-mingw32-gcc || sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y gcc-mingw-w64-x86-64
        timeout-minutes: 5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: native/go.mod, cache: false }
      - run: release/build_shim_zip.sh                                # fh2-mods/FH2MP.dll (Encore fetches the FH2 Mod Platform and Extra Options from their authors)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: shim-unsigned, path: dist/*.zip }

  # FH2MP.dll is built with mingw on Linux; the signing action runs on Windows, so the zip is unpacked, signed and packed again here.
  shim-sign:
    needs: shim
    runs-on: windows-2022
    env: { AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: true }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: shim-unsigned, path: in }
      - name: unpack
        shell: pwsh
        run: Expand-Archive -Path (Get-Item in\*.zip).FullName -DestinationPath pkg
      # Azure Artifact Signing, skipped while the secrets are not set. Secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an app
      # registration with the "Artifact Signing Certificate Profile Signer" role); variables: AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
      # AZURE_SIGNING_PROFILE.
      - name: sign FH2MP.dll
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\pkg\fh2-mods\FH2MP.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = Get-Item in\*.zip
          Compress-Archive -Path pkg\* -DestinationPath "out\$($zip.Name)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: shim, path: out/*.zip }

  publish:
    needs: [check, shim-sign]
    if: ${{ !failure() && !cancelled() }}         # a release that carries its shim skips the shim jobs
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    environment: release              # add required reviewers to this environment in the repository settings to gate signing + publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: true }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with: { go-version-file: native/go.mod, cache: false }
      # The intermediate shim-unsigned artifact has the same ZIP filename as
      # shim. Download only final artifacts, so extraction cannot overwrite the
      # signed ZIP with unsigned bytes or interleave two writes to that file.
      - name: download signed shim
        if: needs.check.outputs.build_shim == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: shim, path: dist }
      # fh2mp-release manifest-build checks the copied zip against the carried release's signed manifest
      - name: carry the shim from its release
        if: needs.check.outputs.build_shim != 'true'
        env: { GH_TOKEN: "${{ github.token }}", SHIM: "${{ needs.check.outputs.shim }}" }
        run: |
          mkdir -p dist "carry/v$SHIM"
          gh release download "v$SHIM" -p manifest.json -p manifest.json.sig -D "carry/v$SHIM" --clobber
          gh release download "v$SHIM" -p "fh2mp-shim-$SHIM.zip" -D dist
      # Encore's files, from its release as release/launcher.json names them; manifest-build checks each against the pin's SHA-256 and size
      - name: download the launcher (Encore)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          . release/reltool.sh
          repo=$(reltool launcher-pin repo); tag=$(reltool launcher-pin tag)
          mkdir -p dist
          for name in $(reltool launcher-pin names); do gh release download "$tag" -R "$repo" -p "$name" -D dist; done
          ls -l dist
      - name: sign the manifest
        env:
          FH2MP_RELEASE_KEY: "${{ secrets.RELEASE_SIGNING_KEY }}"
          SHIM: "${{ needs.check.outputs.shim }}"
          KIND: "${{ needs.check.outputs.kind }}"
        run: |
          . release/reltool.sh
          reltool manifest-build --tag "$GITHUB_REF_NAME" --kind "$KIND" --shim-version "$SHIM" --carry-dir carry --dist dist
      - name: release
        env: { GH_TOKEN: "${{ github.token }}", KIND: "${{ needs.check.outputs.kind }}" }
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          notes="--generate-notes"; [ -f "release/notes/$GITHUB_REF_NAME.md" ] && notes="--notes-file release/notes/$GITHUB_REF_NAME.md"
          title="FH2MP $GITHUB_REF_NAME"; [ "$KIND" = release ] || title="$title ($KIND)"
          gh release create "$GITHUB_REF_NAME" $pre --title "$title" $notes dist/*

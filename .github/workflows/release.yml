name: release

# Push a tag like v1.0.0 (it must equal shim/VERSION and launcher/fh2mp_launcher/version.py) to build everything and publish a GitHub release:
# the shim, the launcher for Windows (installer + portable zip) and Linux (.deb + AppImage), and the signed manifest the launcher updates from.
# A hotfix tag (release/versions.py: a patch of the same X.Y line where only one version file equals the tag) builds that component only; the
# other one's signed manifest entry and files are copied from the release of its version, so the new release holds every file it names.
# Secrets: RELEASE_SIGNING_KEY = base64 Ed25519 seed from release/keygen.py (its public half is in launcher/fh2mp_launcher/constants.py).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the publish job can write (create the release). Actions are pinned to reviewed commits (tag in the comment), the
# build tools and Python packages to hashes (security audit 2026-10-25 F04/F15): bump them on purpose, never to a moving tag.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      shim: ${{ steps.versions.outputs.shim }}
      launcher: ${{ steps.versions.outputs.launcher }}
      build_shim: ${{ steps.versions.outputs.build_shim }}
      build_launcher: ${{ steps.versions.outputs.build_launcher }}
      kind: ${{ steps.versions.outputs.kind }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: versions agree with the tag
        id: versions
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then set -- --tag "$GITHUB_REF_NAME"; else set --; fi
          python3 -I release/versions.py "$@" --github-output "$GITHUB_OUTPUT"
      # The same checks and image as ci.yml (release/ci.sh); publish.sh only tags commits whose ci.yml run passed, so this is the last word,
      # not the first.
      - uses: ./.github/actions/ci-image
      - run: release/ci.sh --container go unit mutations

  shim:
    needs: check
    if: needs.check.outputs.build_shim == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/ci-image
      - run: release/ci.sh --container shim
        timeout-minutes: 10
      - run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"      # back to the runner's user for the build
      # the runner image usually has mingw already; the apt mirror has hung here, so install only if missing, with timeouts
      - run: command -v x86_64-w64-mingw32-gcc || sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y gcc-mingw-w64-x86-64
        timeout-minutes: 5
      - run: release/build_shim_zip.sh                                # fh2-mods/FH2MP.dll (the launcher fetches the FH2 Mod Platform and Extra Options from their authors)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: shim-unsigned, path: dist/*.zip }

  # FH2MP.dll is built with mingw on Linux; the signing action runs on Windows, so the zip is unpacked, signed and packed again here.
  shim-sign:
    needs: shim
    runs-on: windows-2022
    env: { AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}" }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: shim-unsigned, path: in }
      - name: unpack
        shell: pwsh
        run: Expand-Archive -Path (Get-Item in\*.zip).FullName -DestinationPath pkg
      - name: sign FH2MP.dll
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\pkg\fh2-mods\FH2MP.dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: pack
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = Get-Item in\*.zip
          Compress-Archive -Path pkg\* -DestinationPath "out\$($zip.Name)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: shim, path: out/*.zip }

  launcher-windows:
    needs: check
    if: needs.check.outputs.build_launcher == 'true'
    runs-on: windows-2022
    defaults: { run: { working-directory: launcher } }
    env: { AZURE_CLIENT_ID: "${{ secrets.AZURE_CLIENT_ID }}" }       # set = sign with Azure Artifact Signing (see "sign the launcher")
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      # PyInstaller with a bootloader compiled here: the prebuilt one is shared with a lot of malware and gets the exe ML-flagged by Defender
      - run: pip install --require-hashes --no-binary pyinstaller -r requirements-release.txt
        env: { PYINSTALLER_COMPILE_BOOTLOADER: "1" }
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pyinstaller --noconfirm --clean --distpath dist packaging/fh2mp.spec
      - run: dist\fh2mp-launcher\fh2mp-launcher.exe --selftest
      - run: python -m unittest discover -s tests
        env: { FH2MP_NO_KEYRING: "1" }
      - run: python -I ../release/check_test_mutations.py --area launcher
      # Azure Artifact Signing, skipped while the secrets are not set. Secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an app
      # registration with the "Artifact Signing Certificate Profile Signer" role); variables: AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT,
      # AZURE_SIGNING_PROFILE.
      - name: sign the launcher
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\launcher\dist\fh2mp-launcher\fh2mp-launcher.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path fh2mp_launcher/version.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\fh2mp.iss
          Compress-Archive -Path dist\fh2mp-launcher\* -DestinationPath "dist\FH2MP-Launcher-$v-windows-x64-portable.zip"
      - name: sign the installer
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\launcher\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: windows, path: "launcher/dist/*.exe\nlauncher/dist/*.zip" }

  launcher-linux:
    needs: check
    if: needs.check.outputs.build_launcher == 'true'
    runs-on: ubuntu-22.04
    defaults: { run: { working-directory: launcher } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libegl1 fuse zsync
      - run: pip install --require-hashes -r requirements-release.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pyinstaller --noconfirm --clean --distpath dist packaging/fh2mp.spec
      - run: QT_QPA_PLATFORM=offscreen dist/fh2mp-launcher/fh2mp-launcher --selftest
      - run: python -m unittest discover -s tests
        env: { FH2MP_NO_KEYRING: "1", QT_QPA_PLATFORM: offscreen }
      - run: python -I ../release/check_test_mutations.py --area launcher
      - run: packaging/build_deb.sh
      # appimagetool and the AppImage runtime it embeds: fixed releases, checked against reviewed hashes before anything runs
      - run: |
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -sSfL -o "$RUNNER_TEMP/runtime-x86_64" https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c - <<SUMS
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  $RUNNER_TEMP/runtime-x86_64
          SUMS
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGETOOL="$RUNNER_TEMP/appimagetool" APPIMAGE_RUNTIME="$RUNNER_TEMP/runtime-x86_64" packaging/build_appimage.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: linux, path: "launcher/dist/*.deb\nlauncher/dist/*.AppImage\nlauncher/dist/*.zsync" }

  publish:
    needs: [check, shim-sign, launcher-windows, launcher-linux]
    if: ${{ !failure() && !cancelled() }}         # a hotfix skips the jobs of the component it carries
    runs-on: ubuntu-22.04
    permissions: { contents: write }
    environment: release              # add required reviewers to this environment in the repository settings to gate signing + publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install --require-hashes -r release/requirements-sign.txt
      # The intermediate shim-unsigned artifact has the same ZIP filename as
      # shim. Download only final artifacts, so extraction cannot overwrite the
      # signed ZIP with unsigned bytes or interleave two writes to that file.
      - name: download signed shim
        if: needs.check.outputs.build_shim == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: shim, path: dist }
      - name: download Windows launchers
        if: needs.check.outputs.build_launcher == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: windows, path: dist }
      - name: download Linux launchers
        if: needs.check.outputs.build_launcher == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: linux, path: dist }
      # make_manifest.py checks every copied file against the carried release's signed manifest; the copies keep the new release complete for
      # launchers that download from the manifest's own tag only (1.1.5 and older) and for the AppImage's zsync update.
      - name: carry from earlier releases
        if: needs.check.outputs.kind != 'release'
        env:
          GH_TOKEN: "${{ github.token }}"
          SHIM: "${{ needs.check.outputs.shim }}"
          APP: "${{ needs.check.outputs.launcher }}"
          BUILD_SHIM: "${{ needs.check.outputs.build_shim }}"
          BUILD_LAUNCHER: "${{ needs.check.outputs.build_launcher }}"
        run: |
          mkdir -p dist
          carry() { mkdir -p "carry/v$1"; gh release download "v$1" -p manifest.json -p manifest.json.sig -D "carry/v$1" --clobber; }
          if [ "$BUILD_SHIM" != true ]; then carry "$SHIM"; gh release download "v$SHIM" -p "fh2mp-shim-$SHIM.zip" -D dist; fi
          if [ "$BUILD_LAUNCHER" != true ]; then
            carry "$APP"
            gh release download "v$APP" -p "FH2MP-Launcher-$APP-*" -p "fh2mp-launcher_${APP}_*" -D dist
          fi
          ls -l dist
      - name: sign the manifest
        env:
          FH2MP_RELEASE_KEY: "${{ secrets.RELEASE_SIGNING_KEY }}"
          SHIM: "${{ needs.check.outputs.shim }}"
          APP: "${{ needs.check.outputs.launcher }}"
        run: python3 -I release/make_manifest.py --tag "$GITHUB_REF_NAME" --shim-version "$SHIM" --launcher-version "$APP" --carry-dir carry --dist dist
      - name: release
        env: { GH_TOKEN: "${{ github.token }}", KIND: "${{ needs.check.outputs.kind }}" }
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          notes="--generate-notes"; [ -f "release/notes/$GITHUB_REF_NAME.md" ] && notes="--notes-file release/notes/$GITHUB_REF_NAME.md"
          title="FH2MP $GITHUB_REF_NAME"; [ "$KIND" = release ] || title="$title ($KIND)"
          gh release create "$GITHUB_REF_NAME" $pre --title "$title" $notes dist/*

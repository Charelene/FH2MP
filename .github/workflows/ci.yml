name: ci

# Every check on every push and pull request, so a release tag only ever builds a commit that already passed (release/publish.sh and the
# ship step refuse a commit without a green run of this workflow). It runs release/ci.sh in the image from release/ci.Containerfile, the
# same one `release/ci.sh --container` uses on a developer machine. (The Windows job ran the launcher's checks; the launcher left for
# Encore in 1.5.0.)
on:
  push:
    branches: [develop, main, "hotfix/**", "release/**"]       # hotfix/X.Y, release/X.Y.Z: the ship scripts tag only commits whose run passed
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { submodules: true }
      - uses: ./.github/actions/ci-image
      - name: checks
        run: release/ci.sh --container all
